plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}
group = providers.gradleProperty('lunixiGroupId').get()
version = providers.gradleProperty('lunixiVersion').get()
repositories { mavenCentral() }
dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:${providers.gradleProperty('springBootVersion').get()}")
    api "com.lunixi:lunixi-java-sdk:${providers.gradleProperty('lunixiSdkVersion').get()}"
    api 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework:spring-jdbc'
    annotationProcessor platform("org.springframework.boot:spring-boot-dependencies:${providers.gradleProperty('springBootVersion').get()}")
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
    // Test-only security patch beyond the Boot BOM; 3.5.11 fixes October 2026 driver advisories.
    testRuntimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.11'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { withSourcesJar(); withJavadocJar() }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8'; options.compilerArgs << '-Xlint:all' }
// Keep the MIT license with binary, source and Javadoc distributions.
tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(Javadoc).configureEach { options.encoding = 'UTF-8'; options.addStringOption('Xdoclint:none', '-quiet') }
test { useJUnitPlatform() }
publishing {
    publications {
        starter(MavenPublication) {
            artifactId = 'lunixi-spring-boot-starter'
            from components.java
            pom {
                name = 'Lunixi Spring Boot Starter'
                description = 'Native Spring Boot auto-configuration and transactional checkout ledger for Lunixi.'
                url = 'https://github.com/Lunixi-Payment/lunixi-spring-boot-starter'
                licenses { license { name = 'MIT'; url = 'https://opensource.org/licenses/MIT' } }
                developers {
                    developer {
                        id = 'lunixi'
                        name = 'Lunixi'
                        organization = 'Lunixi'
                        organizationUrl = 'https://lunixi.com'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/Lunixi-Payment/lunixi-spring-boot-starter.git'
                    developerConnection = 'scm:git:ssh://git@github.com/Lunixi-Payment/lunixi-spring-boot-starter.git'
                    url = 'https://github.com/Lunixi-Payment/lunixi-spring-boot-starter'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'centralStaging'
            url = layout.buildDirectory.dir('central-staging')
        }
    }
}

// Existing local GPG agent owns the key; no signing material belongs in source.
// Ordinary builds/tests do not need a signing key. Unsigned bundles are layout
// diagnostics only and are rejected by Maven Central.
if (!providers.gradleProperty('lunixiUnsigned').isPresent()) {
    signing {
        useGpgCmd()
        sign publishing.publications.starter
    }
}

tasks.matching { it.name == 'publishStarterPublicationToCentralStagingRepository' }.configureEach {
    doFirst { delete layout.buildDirectory.dir('central-staging') }
}

tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Signed Maven Central upload bundle.'
    dependsOn 'publishStarterPublicationToCentralStagingRepository'
    from(layout.buildDirectory.dir('central-staging')) {
        exclude '**/maven-metadata*'
    }
    archiveFileName = "lunixi-spring-boot-starter-${version}-bundle.zip"
    destinationDirectory = layout.buildDirectory.dir('central')
}
