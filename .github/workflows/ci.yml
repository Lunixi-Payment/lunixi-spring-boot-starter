name: Spring Boot Starter verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    name: JDK ${{ matrix.java }} native JDBC and source acceptance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    services:
      database:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-root-password
          MARIADB_DATABASE: lunixi_spring_ci
          MARIADB_USER: lunixi
          MARIADB_PASSWORD: synthetic-ci-disposable-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      LUNIXI_CI_DATABASE_PASSWORD: synthetic-ci-disposable-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.7.1'
      - name: Offline bootstrap security regressions
        run: python3 -m unittest discover -s tools/tests -v
      - name: Fetch and verify pinned public SDK source
        run: python3 tools/bootstrap-sdk.py
      - name: Configure isolated native database fixture
        run: |
          echo "LUNIXI_TEST_DB_FILE=$RUNNER_TEMP/lunixi-starter-db.json" >> "$GITHUB_ENV"
      - run: python3 tools/ci-db.py
      - name: Strict build, native library tests, SpotBugs and artifacts
        run: gradle --no-daemon -I tools/verification.init.gradle clean test spotbugsMain resolvedAuditDependencies jar sourcesJar javadocJar generatePomFileForStarterPublication --console=plain
      - name: Require actual MariaDB acceptance and inspect artifacts
        run: |
          python3 tools/check-test-results.py
          python3 tools/check-artifacts.py
      - name: Audit resolved runtime and test dependencies
        run: python3 tools/audit-dependencies.py
      - name: Install pinned source scanner
        if: matrix.java == '17'
        run: |
          mkdir -p "$RUNNER_TEMP/lunixi-starter-tools"
          GOBIN="$RUNNER_TEMP/lunixi-starter-tools" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/lunixi-starter-tools" >> "$GITHUB_PATH"
      - name: Full clean source secrets and negative control
        if: matrix.java == '17'
        run: python3 tools/check-secrets.py
      - name: Native MVC sample, browser contract and installed distribution
        if: matrix.java == '17'
        working-directory: samples/spring-boot
        run: |
          gradle --no-daemon -PlunixiStarterSource=../.. test installDist browserContract dependencyInventory
          python3 tools/http-smoke.py
          python3 tools/audit-dependencies.py
