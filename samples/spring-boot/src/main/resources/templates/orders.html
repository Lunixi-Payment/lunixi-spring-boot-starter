<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lunixi Payments</title><link rel="icon" href="/assets/lunixi.svg" type="image/svg+xml"><link rel="stylesheet" th:href="@{/assets/checkout.css}"></head><body><main><img th:src="@{/assets/lunixi.svg}" width="160" alt="Lunixi"><h1 th:text="#{orders}">Your orders</h1><article th:each="order : ${orders}"><h2 th:text="${'#' + order.id}">Order</h2><p><span th:text="${order.displayAmount()}">19.90</span> <span th:text="${order.currency}">TRY</span> · <span th:text="${#messages.msg('state.' + order.state)}">Pending</span></p><form th:if="${order.payable}" th:action="@{/payments/{id}(id=${order.id})}" method="post"><button type="submit" th:text="#{pay}">Pay securely with Lunixi</button></form></article><form th:action="@{/logout}" method="post"><button type="submit" th:text="#{logout}">Sign out</button></form></main></body></html>
