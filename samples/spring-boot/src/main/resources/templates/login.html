<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lunixi Payments</title><link rel="icon" href="/assets/lunixi.svg" type="image/svg+xml"><link rel="stylesheet" th:href="@{/assets/checkout.css}"></head><body><main><img th:src="@{/assets/lunixi.svg}" width="160" alt="Lunixi"><h1 th:text="#{login}">Sign in</h1><form th:action="@{/login}" method="post"><label><span th:text="#{username}">Username</span><input name="username" autocomplete="username" required></label><label><span th:text="#{password}">Password</span><input name="password" type="password" autocomplete="current-password" required></label><button type="submit" th:text="#{login}">Sign in</button></form><p th:if="${param.error}" th:text="#{login.failed}">Sign-in failed</p></main></body></html>
