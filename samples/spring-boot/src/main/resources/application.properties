spring.application.name=lunixi-spring-checkout-example
spring.sql.init.mode=never
spring.datasource.url=${LUNIXI_JDBC_URL:}
spring.datasource.username=${LUNIXI_JDBC_USER:}
spring.datasource.password=${LUNIXI_JDBC_PASSWORD:}
spring.thymeleaf.cache=true
spring.messages.fallback-to-system-locale=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${LUNIXI_SECURE_COOKIES:true}
server.servlet.session.cookie.same-site=lax
logging.level.root=WARN
lunixi.base-url=https://api-gateway.lunixi.com
lunixi.allowed-origins[0]=https://api-gateway.lunixi.com
lunixi.key-id=${LUNIXI_KEY_ID:}
lunixi.private-key=${LUNIXI_PRIVATE_KEY:}
lunixi.webhook-secret=${LUNIXI_WEBHOOK_SECRET:}
lunixi.storage-key=${LUNIXI_STORAGE_KEY:}
lunixi.environment=${LUNIXI_ENVIRONMENT:TEST}
lunixi.jdbc-ledger-enabled=true
sample.merchant-id=${LUNIXI_MERCHANT_ID:}
sample.public-base-url=${LUNIXI_PUBLIC_BASE_URL:}
sample.jdbc-url=${LUNIXI_JDBC_URL:}
sample.initialize-disposable=${LUNIXI_INITIALIZE_DISPOSABLE:false}
sample.alice-password=${DEMO_ALICE_PASSWORD:}
sample.bob-password=${DEMO_BOB_PASSWORD:}
sample.checkout-mode=${LUNIXI_CHECKOUT_MODE:hosted}
sample.preauth=${LUNIXI_PREAUTH:false}
sample.order-locale=${LUNIXI_LOCALE:en}
